name: Build HA-Phone

on:
  push:
    branches: [main]
    paths:
      - "ha-phone/**"
      - ".github/workflows/build.yaml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ha-phone

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ha-phone
        run: pip install -r backend/requirements.txt

      - name: Install sox
        run: sudo apt-get update && sudo apt-get install -y sox

      - name: Run backend tests
        working-directory: ha-phone
        run: python -m pytest backend/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ha-phone/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ha-phone/frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ha-phone/frontend
        run: npm test

      - name: Frontend typecheck + build
        working-directory: ha-phone/frontend
        run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          VERSION="$(python3 - <<'PY'
          from pathlib import Path

          for line in Path("ha-phone/config.yaml").read_text().splitlines():
              if line.startswith("version:"):
                  print(line.split(":", 1)[1].strip().strip('"').strip("'"))
                  break
          else:
              raise SystemExit("Could not read add-on version from ha-phone/config.yaml")
          PY
          )"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building HA-Phone ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.arch }})
        uses: docker/build-push-action@v5
        with:
          context: ./ha-phone
          file: ./ha-phone/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.arch }}:latest
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
