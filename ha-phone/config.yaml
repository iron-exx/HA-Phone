name: "HA-Phone"
version: "0.7.19"
slug: "ha-phone"
description: "SIP PBX for Home Assistant — any SIP trunk, IP phones, softphones, doorbells. Web UI, no CLI needed."
url: "https://github.com/iron-exx/HA-Phone"

arch:
  - amd64
  - aarch64

startup: services
init: false

host_network: true

ingress: true
ingress_port: 8099
ingress_entry: "/"

map:
  - data:rw

options:
  admin_password: "changeme"

schema:
  admin_password: "str"
