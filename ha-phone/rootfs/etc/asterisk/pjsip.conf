; hassio-bpx — pjsip.conf
; Phase 2: transport skeleton + #include chain for generated configs
; PJSIP transport only — legacy SIP channel driver was removed in Asterisk 21

[transport-udp]
type     = transport
protocol = udp
bind     = 0.0.0.0:5060

[transport-udp-ipv6]
type     = transport
protocol = udp
bind     = ::
; No external_signaling_address — IPv6 is globally routable, no NAT (D-01)
; No local_net — all IPv6 traffic treated as external (correct for DG cellular)
; RESEARCH.md Pattern 8: separate stanza required — PJSIP rejects IPv4-mapped IPv6 on dual-stack bind

; Generated configs under /data/asterisk/ — written by cont-init.d and Phase 3 web UI
; pjsip_local.conf MUST be first: it extends [transport-udp](+) with externip
#include "/data/asterisk/pjsip_local.conf"
#include "/data/asterisk/pjsip_extensions.conf"
#include "/data/asterisk/pjsip_trunk.conf"
