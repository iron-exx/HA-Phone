; res_resolver_unbound — DNS resolver used by PJSIP for SRV/NAPTR/A lookups.
;
; PJSIP needs SRV to reach carriers like Deutsche Glasfaser, whose registrar
; dg.voip.dg-w.de publishes _sip._udp SRV → sip10/sip20.voip.dg-w.de. The bare
; A record (185.22.44.186) is NOT the registration server and answers 404.
;
; The Home Assistant Supervisor DNS (172.30.32.3) does not reliably return SRV
; records (a plain A lookup via getent already comes back empty/times out), so
; unbound only got the A record → PJSIP registered to the wrong host → 404.
;
; Point unbound at public resolvers that return SRV correctly. With host_network
; the add-on reaches these directly. Falls back across the list on failure.
[general]
nameserver = 1.1.1.1
nameserver = 8.8.8.8
nameserver = 9.9.9.9
