; hassio-bpx — manager.conf
; AMI bound to 127.0.0.1 ONLY (D-07, SEC-01)
; host_network: true exposes all ports to LAN — never bind to 0.0.0.0
[general]
enabled  = yes
port     = 5038
bindaddr = 127.0.0.1

; TODO Phase 3: generate secret at runtime and store in /data/
[bpx-admin]
secret  = changeme-replace-in-phase3
read    = all
write   = all
; ACL order matters — Asterisk applies rules top-to-bottom, last match wins.
; deny-all FIRST, then permit localhost, else the deny rejects 127.0.0.1 too.
deny    = 0.0.0.0/0.0.0.0
permit  = 127.0.0.1/255.255.255.255
