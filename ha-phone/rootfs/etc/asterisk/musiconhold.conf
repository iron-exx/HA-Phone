; hassio-bpx — musiconhold.conf
; Hold music for res_musiconhold. The files come from the MOH-OPSOUND-WAV
; package enabled in the Dockerfile menuselect (installed to
; /opt/asterisk/var/lib/asterisk/moh in the build stage, copied to
; /var/lib/asterisk/moh = astdatadir/moh in the runtime image).
[general]

[default]
mode      = files
directory = /var/lib/asterisk/moh
sort      = random
