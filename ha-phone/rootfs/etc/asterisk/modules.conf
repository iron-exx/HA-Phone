; hassio-bpx — modules.conf
; Phase 2: explicit load list (autoload=no)
[modules]
autoload = no

; ── pjsip dependencies (must load before res_pjsip) ──────────────────────────
load = res_pjproject.so
; DNS SRV/NAPTR resolver — WITHOUT this, PJSIP falls back to the OS resolver
; (getaddrinfo = A records only, no SRV). Providers like Deutsche Glasfaser publish
; _sip._udp SRV (dg.voip.dg-w.de → sip10/sip20), and the bare A record does NOT serve
; registration → "404 Fatal". Compiled via --with-unbound; must be explicitly loaded
; here because autoload=no. Must load before res_pjsip.so.
load = res_resolver_unbound.so
load = res_sorcery_config.so
load = res_sorcery_memory.so
load = res_sorcery_astdb.so
load = res_geolocation.so
load = res_statsd.so
load = res_rtp_asterisk.so

; ── PJSIP core ────────────────────────────────────────────────────────────────
load = res_pjsip.so
load = res_pjsip_authenticator_digest.so
load = res_pjsip_outbound_authenticator_digest.so
load = res_pjsip_endpoint_identifier_anonymous.so
load = res_pjsip_endpoint_identifier_ip.so
load = res_pjsip_endpoint_identifier_user.so
load = res_pjsip_logger.so
load = res_pjsip_notify.so
load = res_pjsip_outbound_registration.so
load = res_pjsip_path.so
load = res_pjsip_registrar.so
load = res_pjsip_sdp_rtp.so
load = res_pjsip_session.so
load = res_pjsip_pubsub.so
; Caller identity (P-Asserted-Identity / Remote-Party-ID): WITHOUT this module
; send_pai/send_rpid/trust_id_inbound are silently ignored — inbound trunk calls
; lose the real caller number from PAI and internal legs fall back to Anonymous.
load = res_pjsip_caller_id.so
; rewrite_contact / force_rport / rtp_symmetric NAT handling lives here.
load = res_pjsip_nat.so
; SIP REFER = blind/attended transfer from desk phones and softphones.
load = res_pjsip_refer.so
; Voicemail message-waiting indication (endpoint `mailboxes = n@default`).
load = res_pjsip_mwi.so
load = res_pjsip_mwi_body_generator.so
; H.264 fmtp (profile-level-id, packetization-mode) negotiation for video extensions.
load = res_format_attr_h264.so
load = chan_pjsip.so

; ── Bridging technologies — WITHOUT these no two channels can be bridged, so every
;    answered call drops immediately ("Could not create class basic. No technology
;    to support it."). bridge_simple = 1:1 calls; softmix = conferences/fallback. ──
load = bridge_simple.so
load = bridge_softmix.so
load = bridge_native_rtp.so
load = bridge_holding.so

; ── Dialplan functions — func_callerid provides CALLERID() (Set(CALLERID(all)=…)
;    for outbound CLIP); without it "Function CALLERID not registered". ──
load = func_callerid.so
load = func_channel.so
load = func_strings.so
load = func_logic.so
; TIMEOUT(digit)/TIMEOUT(response) used by the IVR menus.
load = func_timeout.so
load = res_musiconhold.so

; ── Applications ──────────────────────────────────────────────────────────────
load = res_adsi.so
load = res_smdi.so
load = app_dial.so
load = app_echo.so
load = app_playback.so
load = app_voicemail.so
load = app_directed_pickup.so
load = app_mixmonitor.so

; ── Codecs ────────────────────────────────────────────────────────────────────
load = codec_alaw.so
load = codec_ulaw.so
load = codec_g722.so

; ── Formats ───────────────────────────────────────────────────────────────────
load = format_wav.so
load = format_wav_gsm.so
load = format_pcm.so

; ── Dialplan + CDR ────────────────────────────────────────────────────────────
load = pbx_config.so
load = cdr_csv.so
