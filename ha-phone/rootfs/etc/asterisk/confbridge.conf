; HA-Phone — confbridge.conf
; Only used by the door fanout (Türklingel-Verteiler, haphone-door-* contexts in
; extensions_routing.conf): the door station sits UNANSWERED in a conference as its
; video source, one leg per ringing device joins it, the first device to answer wins.
[general]

[haphone_door_bridge]
type = bridge
; Everybody sees the door (the first marked user), nobody else's video is mixed in.
video_mode = first_marked
max_members = 50
internal_sample_rate = auto
mixing_interval = 20

; The door station while it rings: early media only (Progress), it stays unanswered
; until a device answers. timeout comes from the dialplan (ring time of the group).
[haphone_door_ringing]
type = user
marked = yes
quiet = yes
answer_channel = no
announce_only_user = no
music_on_hold_when_empty = no
dtmf_passthrough = yes

; The door station after a device answered (it rejoins answered).
[haphone_door_talking]
type = user
marked = yes
quiet = yes
announce_only_user = no
music_on_hold_when_empty = no
dtmf_passthrough = yes

; One leg per ringing device. Until it answers, FRAME_DROP on the device channel keeps
; its microphone and keys away from the door; afterwards DTMF (door code) passes.
[haphone_door_leg]
type = user
quiet = yes
announce_only_user = no
music_on_hold_when_empty = no
dtmf_passthrough = yes
